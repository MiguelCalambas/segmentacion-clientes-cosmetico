name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: segmentacion
          POSTGRES_USER: segmentacion
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U segmentacion -d segmentacion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/segmentacion
      POSTGRES_USER: segmentacion
      POSTGRES_PASSWORD: ci_password
      PROVEEDOR_IA: plantilla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify